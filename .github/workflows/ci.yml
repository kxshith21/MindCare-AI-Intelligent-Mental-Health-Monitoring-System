name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Non-secret placeholders only. Tests force LLM_PROVIDER=fake, so no live LLM
# or Supabase project is contacted. Never put real keys here.
env:
  ENVIRONMENT: test
  CORS_ORIGINS: http://127.0.0.1:3000
  SUPABASE_URL: http://127.0.0.1:54321
  SUPABASE_SERVICE_ROLE_KEY: ci-service-role-placeholder
  LLM_PROVIDER: fake
  LLM_API_KEY: ""
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-placeholder
  API_URL: http://127.0.0.1:8000
  NEXT_PUBLIC_API_URL: http://127.0.0.1:8000

jobs:
  api:
    name: API (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # No linter is pinned in api/requirements.txt; use ruff if one is added
      # later, otherwise fall back to a byte-compile syntax check.
      - name: Lint / syntax check
        shell: bash
        run: |
          if python -m ruff --version >/dev/null 2>&1; then
            python -m ruff check app tests
          else
            python -m compileall -q app tests
          fi

      - name: Tests
        run: python -m pytest -q

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Playwright is intentionally excluded here — see e2e.yml.
      - name: Production build
        run: npm run build

  supabase:
    name: Supabase (RLS)
    runs-on: ubuntu-latest
    env:
      # Placeholders for env() lookups in supabase/config.toml. Local CLI only.
      OPENAI_API_KEY: ci-placeholder
      S3_HOST: local
      S3_REGION: local
      S3_ACCESS_KEY: ci-placeholder
      S3_SECRET_KEY: ci-placeholder
      SUPABASE_AUTH_SMS_TWILIO_AUTH_TOKEN: ci-placeholder
      SUPABASE_AUTH_EXTERNAL_APPLE_SECRET: ci-placeholder
      DB_CONTAINER: supabase_db_MindCare-AI-Intelligent-Mental-Health-Mo
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        working-directory: supabase
        run: supabase start

      - name: Reset database (migrations + seed)
        working-directory: supabase
        run: supabase db reset

      # Same runner script as the header of supabase/tests/rls_test.sql.
      # Any failed assertion raises SQLSTATE TSTFL and fails the step.
      - name: Run RLS tests
        working-directory: supabase
        shell: bash
        run: |
          docker cp tests/rls_test.sql "$DB_CONTAINER:/tmp/rls_test.sql"
          docker exec "$DB_CONTAINER" \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 -f /tmp/rls_test.sql \
            > "$RUNNER_TEMP/rls_test.log" 2>&1
          cat "$RUNNER_TEMP/rls_test.log"
          grep -q "=== ALL 14 RLS SCENARIOS PASSED ===" "$RUNNER_TEMP/rls_test.log"

      - name: Stop local Supabase
        if: always()
        working-directory: supabase
        run: supabase stop

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Install the pinned upstream binary directly: no GITLEAKS_LICENSE
      # requirement and no third-party action dependency.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.28.0"
        run: |
          curl -fsSL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o "$RUNNER_TEMP/gitleaks.tgz"
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan repository history
        run: gitleaks detect --source . --config .gitleaks.toml --redact --verbose
