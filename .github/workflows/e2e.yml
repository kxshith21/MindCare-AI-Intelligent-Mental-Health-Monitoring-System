name: E2E (Playwright)

# Manual by default; the nightly schedule is optional and can be disabled in
# GitHub → Actions → E2E (Playwright) → Settings if not needed.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

# Everything below is local-only. Supabase CLI generates throwaway local test
# keys at runtime; no hosted project, remote endpoint, or real secret is used.
env:
  PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
  ENVIRONMENT: test
  CORS_ORIGINS: http://127.0.0.1:3000
  LLM_PROVIDER: fake
  LLM_API_KEY: ""
  LLM_MODEL: test-model
  NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
  API_URL: http://127.0.0.1:8000
  DB_CONTAINER: supabase_db_MindCare-AI-Intelligent-Mental-Health-Mo
  OPENAI_API_KEY: ci-placeholder
  S3_HOST: local
  S3_REGION: local
  S3_ACCESS_KEY: ci-placeholder
  S3_SECRET_KEY: ci-placeholder
  SUPABASE_AUTH_SMS_TWILIO_AUTH_TOKEN: ci-placeholder
  SUPABASE_AUTH_EXTERNAL_APPLE_SECRET: ci-placeholder

jobs:
  playwright:
    name: Playwright against local Supabase + API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install API dependencies
        working-directory: api
        run: python -m pip install -r requirements.txt

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Install Playwright browser
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Start local Supabase and seed demo data
        working-directory: supabase
        shell: bash
        run: |
          supabase start
          supabase db reset
          # status -o env writes API_URL / ANON_KEY / SERVICE_ROLE_KEY for the
          # throwaway local instance. These are not secrets and never leave CI.
          supabase status -o env > "$RUNNER_TEMP/supabase.env"
          set -a
          . "$RUNNER_TEMP/supabase.env"
          set +a
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      - name: Start API
        working-directory: api
        shell: bash
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 \
            > "$RUNNER_TEMP/api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/api.pid"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then
              echo "API is ready"
              exit 0
            fi
            sleep 1
          done
          echo "API failed to start" >&2
          cat "$RUNNER_TEMP/api.log" >&2
          exit 1

      # playwright.config.ts starts `npm run dev` itself in CI via webServer.
      - name: Run Playwright
        working-directory: web
        run: npm run test:e2e

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            web/test-results/
            web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Tear down local services
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/api.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/api.pid")" 2>/dev/null || true
          fi
          cd supabase && supabase stop
