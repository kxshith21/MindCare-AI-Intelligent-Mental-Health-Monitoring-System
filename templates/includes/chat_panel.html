<div id="riskAlertPanel" class="risk-alert-panel d-none" role="alert">
    <div class="risk-alert-icon"><i class="bi bi-heart-fill"></i></div>
    <div>
        <strong>We're concerned about you</strong>
        <p class="mb-1">Please reach out to someone you trust, or call/text <strong>988</strong> (US Crisis Lifeline).</p>
        <small class="text-muted">If in immediate danger, contact emergency services.</small>
    </div>
</div>

<div class="chat-shell glass-panel h-100">
    <div class="chat-shell-header">
        <div class="chat-agent">
            <div class="agent-avatar"><i class="bi bi-robot"></i><span class="agent-status"></span></div>
            <div>
                <div class="agent-name">MindCare Assistant</div>
                <div class="agent-meta">Emotion-aware · Always listening</div>
            </div>
        </div>
        <span class="status-pill"><span class="pulse"></span> Online</span>
    </div>

    <div class="chat-thread" id="chatMessages">
        <div class="msg-row ai fade-in">
            <div class="msg-avatar ai"><i class="bi bi-robot"></i></div>
            <div class="msg-block">
                <div class="msg-bubble ai">Hey — I'm glad you're here. What's been on your mind lately?</div>
                <div class="msg-meta"><span>MindCare</span> · just now</div>
            </div>
        </div>
    </div>

    <div class="chat-suggestions" id="quickPrompts">
        <button type="button" class="suggestion-chip" data-prompt="I feel anxious today">😰 Anxious</button>
        <button type="button" class="suggestion-chip" data-prompt="I'm feeling happy today">😊 Happy</button>
        <button type="button" class="suggestion-chip" data-prompt="I had a tough day">😔 Tough day</button>
        <button type="button" class="suggestion-chip" data-prompt="I need someone to talk to">💬 Just talk</button>
    </div>

    <div class="chat-composer">
        <form id="chatForm" class="composer-form">
            <div class="composer-inner">
                <input type="text" id="userInput" class="composer-input" placeholder="Share what's on your mind..." autocomplete="off" required>
                <button type="submit" class="composer-send" id="sendBtn" aria-label="Send">
                    <i class="bi bi-send-fill" id="sendIcon"></i>
                    <span class="spinner-border spinner-border-sm d-none" id="sendSpinner" role="status"></span>
                </button>
            </div>
        </form>
        <div id="typingIndicator" class="typing-row d-none">
            <div class="msg-avatar ai sm"><i class="bi bi-robot"></i></div>
            <div class="typing-dots"><span></span><span></span><span></span></div>
        </div>
    </div>
</div>
